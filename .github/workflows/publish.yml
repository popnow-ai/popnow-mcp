name: Publish

# Runs when a version tag (v1.2.3) is pushed. Publishes server.json to the MCP Registry through GitHub OIDC,
# so no registry token is stored in this repository. The @popnow/mcp npm package lives in popnow-ai/popnow-api-mcp.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tag matches the server.json version
        run: |
          srv=$(node -p "require('./server.json').version")
          test "v$srv" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match server.json version $srv"; exit 1; }

      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher

      - name: Publish server.json to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
