name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check example configs and manifests are valid JSON
        run: for f in examples/*.json server.json mcp.json .mcp.json plugin.json gemini-extension.json; do node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"; done
      - name: This repository is OAuth only (API keys belong to popnow-ai/popnow-api-mcp)
        run: |
          if grep -rnE 'sk-popnow-|POPNOW_API_KEY|bearer_token_env_var' --include='*.json' --include='*.toml' examples server.json mcp.json .mcp.json gemini-extension.json; then
            echo "API key settings found in a consumer config"; exit 1
          fi
